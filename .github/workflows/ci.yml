name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  safe-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify immutable migration chain
        run: npm run verify:migrations
      - name: Verify asset cache-busting stamps
        run: node stamp_assets.js --check
      - name: Verify published sample templates
        run: npm run templates:check
      - name: Run offline-safe regression suite
        run: npm test
