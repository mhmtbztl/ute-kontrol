name: Live database regression

# Veritabanina yazan 22 suit. Ayri bir Supabase TEST projesi gerektirir.
# Kurulum: docs/TEST_PROJECT_SETUP.md
#
# Bu is akisi LIVE_TESTS_ENABLED repo degiskeni 'true' iken calisir; 16 Eylul
# 2026'da acildi. Degisken bir sebeple geri alinirsa is akisi sessizce atlanir.
# Sebep: secret'lar tanimli degilken her gece kirmizi bir kosu uretmek, gercek
# bir kirilmayi da gorunmez kilar.

on:
  workflow_dispatch:
  schedule:
    # Gecelik tek kosu. Ardisik tam kosular Supabase hiz limitine takilir ve
    # suitleri sahte bicimde kirmiziya cevirir (CLAUDE.md 5.6).
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  # Ayni anda iki kosu, ayni test projesinde birbirinin kullanicilarini siler.
  group: live-tests
  cancel-in-progress: false

jobs:
  live-regression:
    if: vars.LIVE_TESTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEXBNB_ALLOW_DESTRUCTIVE_TESTS: '1'
      LEXBNB_CONFIRM_REMOTE_TEST_PROJECT: ${{ vars.TEST_SUPABASE_HOST }}
      SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify immutable migration chain
        run: npm run verify:migrations
      - name: Run full regression against the dedicated test project
        # test:live kapiyi kendisi dogrular: hedef uretimse veya beyan
        # edilmemisse kosmadan durur.
        run: npm run test:live

  schema-drift:
    if: vars.SCHEMA_DRIFT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LEXBNB_CONFIRM_REMOTE_TEST_PROJECT: ${{ vars.TEST_SUPABASE_HOST }}
      LEXBNB_CONFIRM_PRODUCTION_PROJECT: ${{ vars.PRODUCTION_SUPABASE_HOST }}
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
      PRODUCTION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compare canonical, test and production OpenAPI contracts
        run: npm run schema:drift
