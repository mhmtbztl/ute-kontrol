<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lexbnb hesabınız</title>
</head>
<body style="margin:0;background:#f8fafc;color:#17324d;font-family:Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f8fafc;padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden;">
        <tr><td style="padding:28px 32px 12px;">
          <img src="https://lexbnb.space/assets/brand/lexbnb-logo-email.png" width="190" alt="Lexbnb" style="display:block;width:190px;max-width:100%;height:auto;border:0;">
        </td></tr>
        <tr><td style="padding:12px 32px 32px;">
          <h1 style="margin:0 0 12px;font-size:24px;line-height:1.3;color:#17324d;">İşleminizi tamamlayın</h1>
          <p style="margin:0 0 22px;font-size:15px;line-height:1.6;color:#475569;">Lexbnb hesabınız için istenen işlemi güvenle tamamlamak üzere aşağıdaki düğmeyi kullanın.</p>
          <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 20px;border-radius:8px;background:#f2555a;color:#ffffff;text-decoration:none;font-size:15px;font-weight:700;">Lexbnb’ye devam et</a>
          <p style="margin:24px 0 0;font-size:12px;line-height:1.5;color:#64748b;">Bu isteği siz başlatmadıysanız e-postayı yok sayabilirsiniz.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>

</html>
